esphome:
  name: teplomer-thread

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf
  # u ESPHome starsiho nez 2026.9.0 odkomentuj:
  # toolchain: platformio

external_components:
  - source: github://DavidvtWout/esphome-matter@main

logger:

api:
  encryption:
    key: "mEpOiD1VZjzaOywd3yUhiYHg0DigsvcLSUGwlPcFs6Q="

ota:
  - platform: esphome

network:
  enable_ipv6: true

openthread:
  device_type: FTD #router_role
  tlv: "0E080000000000010000000300000F4A0300001235060004001FFFE002080453941D7541003B0708FD978DB051298A07051077FABC98EE0421AFE411E3312B3D8AE0030E68612D7468726561642D32386435010228D50410396CF4DED6E2987D22B4919D049186540C0402A0F7F8"

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true

sensor:
  - platform: bmp085
    temperature:
      name: "Teplota BMP180"
      id: bmp_temp
    pressure:
      name: "Tlak BMP180"
      id: bmp_press
    update_interval: 30s

  - platform: dht
    model: DHT11
    pin: GPIO2
    temperature:
      name: "Teplota DHT11"
      id: dht_temp
      accuracy_decimals: 0
    humidity:
      name: "Vlhkost DHT11"
      id: dht_hum
    update_interval: 60s

  - platform: sht4x
    address: 0x44
    precision: High
    temperature:
      name: "Teplota SHT40"
      id: sht_temp
    humidity:
      name: "Vlhkost SHT40"
      id: sht_hum
    update_interval: 60s

# Souhrn vsech senzoru v logu kazdou minutu
interval:
  - interval: 60s
    then:
      - logger.log:
          format: "SOUHRN EP1 BMP180 teplota: %.2f C | EP2 BMP180 tlak: %.1f hPa"
          args: ['id(bmp_temp).state', 'id(bmp_press).state']
      - logger.log:
          format: "SOUHRN EP5 DHT11 teplota: %.1f C | EP8 DHT11 vlhkost: %.1f %%RH"
          args: ['id(dht_temp).state', 'id(dht_hum).state']
      - logger.log:
          format: "SOUHRN EP6 SHT40 teplota: %.2f C | EP7 SHT40 vlhkost: %.1f %%RH"
          args: ['id(sht_temp).state', 'id(sht_hum).state']

output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: user_led_output

light:
  - platform: binary
    name: "Uzivatelska LED"
    id: user_led
    output: user_led_output

  - platform: esp32_rmt_led_strip
    name: "RGB pasek"
    id: rgb_strip
    pin: GPIO18
    num_leds: 8
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

matter:
  vendor_name: "David Sindelar - BP VUT"
  vendor_id: 0xFFF1
  product_name: "Thread BMP180 teplomer"
  product_id: 0x8000
  hardware_version: 1
  hardware_version_string: "ESP32-C6 XIAO + BMP180 breadboard v1"
  endpoints:
    1:
      temperature_sensor:
        temperature: bmp_temp
    2:
      pressure_sensor:
        pressure: bmp_press
    3:
      on_off_light:
        light_id: user_led
    4:
      extended_color_light:
        light_id: rgb_strip
    5:
      temperature_sensor:
        temperature: dht_temp
    6:
      temperature_sensor:
        temperature: sht_temp
    7:
      humidity_sensor:
        relative_humidity: sht_hum
    8:
      humidity_sensor:
        relative_humidity: dht_hum